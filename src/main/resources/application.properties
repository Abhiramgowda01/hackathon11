# ============================================================
# CCTV AI MONITOR - APPLICATION CONFIGURATION
# ============================================================

# ------------------------------------------------------------
# SPRING BOOT SERVER
# ------------------------------------------------------------

server.port=8000


# ------------------------------------------------------------
# H2 DATABASE
# ------------------------------------------------------------

spring.datasource.url=jdbc:h2:file:./data/events;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false


# ------------------------------------------------------------
# FILE UPLOAD
# ------------------------------------------------------------

spring.servlet.multipart.max-file-size=1GB
spring.servlet.multipart.max-request-size=1GB


# ------------------------------------------------------------
# OPENAI
# ------------------------------------------------------------

# Optional.
# The API key can be provided through the OPENAI_API_KEY
# environment variable.

openai.api-key=${OPENAI_API_KEY:}

openai.vision-model=${OPENAI_VISION_MODEL:gpt-4o-mini}

openai.embedding-model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}


# ============================================================
# CCTV CAMERA CONFIGURATION
# ============================================================

# ------------------------------------------------------------
# OPTION A - LAPTOP / USB WEBCAM
# ------------------------------------------------------------
# CURRENTLY ACTIVE
#
# camera.type:
# A = Laptop / USB webcam
# B = IP CCTV / RTSP
# C = Recorded MP4/video
#
# webcam-index:
# 0 = default laptop webcam
# 1 = second webcam
# 2 = third webcam
# ------------------------------------------------------------

camera.type=A
camera.webcam-index=0


# ------------------------------------------------------------
# OPTION B - IP CCTV / RTSP
# ------------------------------------------------------------
# FUTURE USE - KEEP COMMENTED FOR NOW
#
# Example:
#
# camera.type=B
# camera.rtsp-url=rtsp://10.26.162.40:8554/
#
# When you get an IP CCTV camera, uncomment these lines
# and replace the RTSP URL with the real camera URL.
# ------------------------------------------------------------

# camera.type=B
# camera.rtsp-url=rtsp://username:password@192.168.1.100:554/stream


# ------------------------------------------------------------
# OPTION C - RECORDED CCTV VIDEO
# ------------------------------------------------------------
# FUTURE USE - KEEP COMMENTED FOR NOW
#
# Example:
#
# camera.type=C
# camera.video-file=C:/Users/Lenovo/Videos/cctv-test.mp4
#
# When you want to process a recorded CCTV video,
# uncomment these lines and provide the real MP4 path.
# ------------------------------------------------------------

# camera.type=C
# camera.video-file=C:/Users/Lenovo/Videos/cctv-test.mp4